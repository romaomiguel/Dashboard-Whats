services:
  - type: web
    name: evolution-api
    runtime: image
    image:
      url: docker.io/evoapicloud/evolution-api:v2.3.7
    plan: free
    healthCheckPath: /
    envVars:
      - key: SERVER_URL
        sync: false
      - key: AUTHENTICATION_API_KEY
        generateValue: true
      - key: DATABASE_ENABLED
        value: "true"
      - key: DATABASE_PROVIDER
        value: postgresql
      - key: DATABASE_CONNECTION_URI
        sync: false
      - key: DATABASE_CONNECTION_CLIENT_NAME
        value: evolution
      # A sessão precisa sobreviver a reinício, senão o QR teria de ser lido
      # de novo a cada deploy. Esta fica ligada.
      - key: DATABASE_SAVE_DATA_INSTANCE
        value: "true"
      # Estas quatro guardam o que o ZapCRM nunca consulta: a agenda inteira
      # do WhatsApp, todas as conversas, as etiquetas e o histórico antigo que
      # o celular despeja ao conectar. Nenhuma tela lê o schema da Evolution —
      # os endpoints findContacts, findChats e findMessages não são chamados
      # em lugar nenhum do app.
      - key: DATABASE_SAVE_DATA_CONTACTS
        value: "false"
      - key: DATABASE_SAVE_DATA_CHATS
        value: "false"
      - key: DATABASE_SAVE_DATA_LABELS
        value: "false"
      - key: DATABASE_SAVE_DATA_HISTORIC
        value: "false"

      # Estas duas ficam LIGADAS por ora.
      #
      # A aba de Mensagens depende do webhook, não do banco da Evolution: o
      # que entra é gravado em public.mensagens pelo receptor, e os recibos de
      # entrega e leitura chegam por MESSAGES_UPDATE. Só que não consegui
      # confirmar, no código da v2.3.7, se desligar a persistência silencia
      # também a emissão do evento. Até haver teste, o risco de perder a aba
      # de Mensagens não compensa o espaço economizado.
      #
      # Como testar, em dois minutos e reversível: desligue as duas, reinicie,
      # mande uma mensagem de outro celular para o número conectado e veja se
      # ela aparece em Mensagens. Aparecendo, pode deixar desligado.
      - key: DATABASE_SAVE_DATA_NEW_MESSAGE
        value: "true"
      - key: DATABASE_SAVE_MESSAGE_UPDATE
        value: "true"
      - key: CACHE_REDIS_ENABLED
        value: "false"
      - key: CACHE_LOCAL_ENABLED
        value: "true"
      - key: CONFIG_SESSION_PHONE_CLIENT
        value: ZapCRM
      - key: CONFIG_SESSION_PHONE_NAME
        value: Chrome
      - key: WEBHOOK_GLOBAL_ENABLED
        value: "false"
      - key: LOG_LEVEL
        value: ERROR
