services:
  - type: web
    name: evolution-api
    runtime: image
    image:
      url: docker.io/evoapicloud/evolution-api:v2.3.7
    plan: free
    healthCheckPath: /
    envVars:
      - key: SERVER_URL
        sync: false
      - key: AUTHENTICATION_API_KEY
        generateValue: true
      - key: DATABASE_ENABLED
        value: "true"
      - key: DATABASE_PROVIDER
        value: postgresql
      - key: DATABASE_CONNECTION_URI
        sync: false
      - key: DATABASE_CONNECTION_CLIENT_NAME
        value: evolution
      # A sessão precisa sobreviver a reinício, senão o QR teria de ser lido
      # de novo a cada deploy. Esta fica ligada.
      - key: DATABASE_SAVE_DATA_INSTANCE
        value: "true"
      # As demais ficam desligadas de propósito. Ligadas, a Evolution despeja
      # o histórico inteiro do WhatsApp — mensagens, cada atualização de
      # status, a agenda toda e todas as conversas — no mesmo Postgres do
      # Supabase, e no plano free isso é o que consome a memória.
      #
      # O ZapCRM não lê nada disso: ele guarda a própria cópia do que envia e
      # do que recebe em public.mensagens, alimentada pelo webhook. Os
      # endpoints findContacts, findChats e findMessages não são usados.
      #
      # Desligar aqui não afeta o webhook: ele continua entregando os eventos,
      # inclusive os recibos de entrega e leitura. O que muda é só a Evolution
      # parar de arquivar o que ninguém consulta.
      - key: DATABASE_SAVE_DATA_NEW_MESSAGE
        value: "false"
      - key: DATABASE_SAVE_MESSAGE_UPDATE
        value: "false"
      - key: DATABASE_SAVE_DATA_CONTACTS
        value: "false"
      - key: DATABASE_SAVE_DATA_CHATS
        value: "false"
      - key: DATABASE_SAVE_DATA_LABELS
        value: "false"
      - key: DATABASE_SAVE_DATA_HISTORIC
        value: "false"
      - key: CACHE_REDIS_ENABLED
        value: "false"
      - key: CACHE_LOCAL_ENABLED
        value: "true"
      - key: CONFIG_SESSION_PHONE_CLIENT
        value: ZapCRM
      - key: CONFIG_SESSION_PHONE_NAME
        value: Chrome
      - key: WEBHOOK_GLOBAL_ENABLED
        value: "false"
      - key: LOG_LEVEL
        value: ERROR
